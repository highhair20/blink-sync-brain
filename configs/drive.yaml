storage:
  virtual_drive_path: "/var/blink_storage/virtual_drive.img"
  virtual_drive_size_gb: 32

watcher:
  poll_interval: 5            # seconds between mtime checks
  settle_seconds: 10          # seconds of no changes before scanning
  rsync_timeout: 30
  shadow_mount_point: "/mnt/blink_shadow"
  state_file: "/var/blink_storage/watcher_state.json"
  processor_video_path: "/var/blink_storage/videos"

logging:
  level: "INFO"
